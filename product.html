<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Item Details</title>
  <link rel="stylesheet" href="css/product-profile.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- body
--------------------------------- -->
<body>
  <!-- sec-navbar
  --------------------------------- -->
  <div class="sec-navbar">
    <a class="sec-navbar-link" href="index.html">home</a>/<a class="sec-navbar-link" href="itemsBacket.html">product type</a>
  </div>
  <!-- heading 01
  --------------------------------- -->
  <h2 class="header2">Item Details</h2>
  <!-- Main img card
  --------------------------------- -->
    
  <!-- item-details
  --------------------------------- -->
  <div class="item-details-frame">
    <div class="item-frame">
      <div id="main-img" class="item-pre">
        <img src="assets/thumbnails/coming-soon.jpg" alt="main-img">
      </div>
    </div>
    <div class="item-details">
      <div class="item-name">
        <h3 id="p-name"></h3>
      </div>
      <div class="ad-details">
        <p id="p-type"><b>Type:</b> </p>
        <p id="p-box"><b>in box:</b> </p>
        <p id="p-location"><b>Location:</b> </p>
        <p id="p-material"><b>Material:</b> </p>
      </div>
    </div>
  </div>
  <h2 class="header2">Other Viewing Angle</h2>
  <div id="extra-img-container" class="ad-images"></div>
  <div id="image-viewer-modal" class="viewer-modal" style="display: none;">
    <span class="close-viewer" onclick="closeViewer()">&times;</span>
    
    <div class="viewer-content">
        <button class="nav-btn prev-btn" onclick="changeViewerImage(-1)">&#10094;</button>
        
        <div class="viewer-img-container" id="swipe-area">
            <img id="modal-target-img" src="#" alt="Original View">
        </div>
        
        <button class="nav-btn next-btn" onclick="changeViewerImage(1)">&#10095;</button>
    </div>
</div>

    <!-- footer
  ----------------------------------- -->
  <footer class="footer" id="footer">
    <p> &#169; 2026 by Aditya's Universe 
    <br>Thank &#9829 You</p>
  </footer>
  <script src="./js/productData.js"></script>
  <script src="js/productScript.js"></script>
</body>
</html>
