    <script>
        function goToPage() {
            var dropdown = document.getElementById("myNavigation");
            var destination = dropdown.value;

            // Agar value khali nahi hai, to us link par bhej do
            if (destination) {
                window.location.href = destination;
            }
        };

      this.src = "gh://repo/adiaug43/adityauniverse@main/assets/thumbnail/kits/loading.gif"; // Yahan apni default image ka URL/path dein

  });
});
